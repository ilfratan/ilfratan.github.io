name: Actualizar notas de Rolling Stone

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Buscar notas, fotos y ordenar por fecha
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          ARCHIVO = Path('index.html')
          AUTOR = 'https://es.rollingstone.com/author/fernando-fratantoni/'
          MESES = {'ene': 1, 'feb': 2, 'mar': 3, 'abr': 4, 'may': 5, 'jun': 6,
                   'jul': 7, 'ago': 8, 'sep': 9, 'oct': 10, 'nov': 11, 'dic': 12}
          sesion = requests.Session()
          sesion.headers['User-Agent'] = 'Mozilla/5.0 (compatible; ILFratanArchive/1.0)'

          def fecha(texto):
              texto = str(texto or '').lower().strip()
              m = re.search(r'(?:19|20)\d{2}-\d{2}-\d{2}', texto)
              if m:
                  try:
                      return datetime.strptime(m.group(), '%Y-%m-%d').date().isoformat()
                  except ValueError:
                      pass
              m = re.search(r'(\d{1,2})[-/ ]([a-záéíóú]{3,})[-/ ]((?:19|20)\d{2})', texto)
              if m and m.group(2)[:3] in MESES:
                  try:
                      return datetime(int(m.group(3)), MESES[m.group(2)[:3]], int(m.group(1))).date().isoformat()
                  except ValueError:
                      pass
              return ''

          def metadatos(url):
              try:
                  r = sesion.get(url, timeout=15)
                  r.raise_for_status()
              except requests.RequestException as exc:
                  print(f'No se pudo consultar {url}: {exc}')
                  return '', ''
              soup = BeautifulSoup(r.text, 'html.parser')
              def meta(*claves):
                  for clave in claves:
                      for atributo in ('property', 'name', 'itemprop'):
                          etiqueta = soup.find('meta', attrs={atributo: clave})
                          if etiqueta and etiqueta.get('content'):
                              return etiqueta['content'].strip()
                  return ''
              publicado = meta('article:published_time', 'datePublished', 'parsely-pub-date')
              imagen = meta('og:image', 'twitter:image', 'twitter:image:src')
              for etiqueta in soup.find_all('script', type='application/ld+json'):
                  try:
                      dato = json.loads(etiqueta.string or etiqueta.get_text())
                  except (ValueError, TypeError):
                      continue
                  elementos = dato if isinstance(dato, list) else [dato]
                  for elemento in elementos:
                      if not isinstance(elemento, dict):
                          continue
                      elementos_grafo = elemento.get('@graph', [])
                      objetos = [elemento] + (elementos_grafo if isinstance(elementos_grafo, list) else [])
                      for obj in objetos:
                          if not isinstance(obj, dict):
                              continue
                          tipo = obj.get('@type', [])
                          tipos = [tipo] if isinstance(tipo, str) else tipo
                          if not any(t in ('Article', 'NewsArticle', 'BlogPosting') for t in tipos):
                              continue
                          publicado = publicado or obj.get('datePublished', '')
                          if not imagen:
                              foto = obj.get('image', '')
                              if isinstance(foto, str):
                                  imagen = foto
                              elif isinstance(foto, dict):
                                  imagen = foto.get('url', '')
                              elif isinstance(foto, list) and foto:
                                  primer = foto[0]
                                  imagen = primer if isinstance(primer, str) else primer.get('url', '') if isinstance(primer, dict) else ''
              imagen = urljoin(url, imagen) if imagen else ''
              if urlparse(imagen).scheme != 'https':
                  imagen = ''
              return fecha(publicado), imagen

          original = ARCHIVO.read_text(encoding='utf-8')
          patron = re.compile(r'(<div class="cards" id="stories">)(.*?)(</div>\s*<p class="note">)', re.S)
          bloque = patron.search(original)
          if not bloque:
              raise SystemExit('No se encontro la seccion de articulos. No se modifico el sitio.')
          documento = BeautifulSoup(bloque.group(2), 'html.parser')
          tarjetas = list(documento.find_all('article', class_='story'))
          enlaces = {a['href'].split('?')[0].split('#')[0]
                     for tarjeta in tarjetas for a in [tarjeta.find('a', href=True)] if a}

          try:
              r = sesion.get(AUTOR, timeout=25)
              r.raise_for_status()
              pagina = BeautifulSoup(r.text, 'html.parser')
              candidatos = {}
              for a in pagina.find_all('a', href=True):
                  url = urljoin(AUTOR, a['href']).split('?')[0].split('#')[0]
                  if urlparse(url).netloc != 'es.rollingstone.com' or not urlparse(url).path.startswith('/arg-'):
                      continue
                  titulo = a.get_text(' ', strip=True)
                  if len(titulo) >= 25:
                      candidatos.setdefault(url, titulo)
          except requests.RequestException as exc:
              print(f'No se pudo consultar pagina de autor: {exc}. Se mantienen las notas existentes.')
              candidatos = {}

          def firma_y_bajada_verificadas(url):
              """Solo incorporar notas con firma personal comprobable en la propia nota."""
              from bs4 import NavigableString
              try:
                  respuesta = sesion.get(url, timeout=18)
                  respuesta.raise_for_status()
                  pagina_nota = BeautifulSoup(respuesta.text, 'html.parser')
              except requests.RequestException as exc:
                  print(f'Se omite sin confirmar autor: {url} ({exc})')
                  return False, ''

              nombre = 'fernando fratantoni'
              cabecera = pagina_nota.find('h1')
              firma_visible = False
              if cabecera:
                  fragmentos = []
                  longitud = 0
                  for nodo in cabecera.next_elements:
                      if isinstance(nodo, NavigableString):
                          linea = ' '.join(str(nodo).split())
                          if linea:
                              fragmentos.append(linea)
                              longitud += len(linea) + 1
                              if longitud >= 950:
                                  break
                  encabezado = ' '.join(fragmentos)
                  firma_visible = bool(re.search(r'\bpor\s+fernando\s+fratantoni\b', encabezado, re.I))

              firma_meta = False
              for clave, valor in (('name', 'author'), ('property', 'article:author'),
                                   ('name', 'parsely-author'), ('itemprop', 'author')):
                  etiqueta = pagina_nota.find('meta', attrs={clave: valor})
                  if etiqueta and etiqueta.get('content', '').strip().casefold() == nombre:
                      firma_meta = True

              firma_estructurada = False
              for script in pagina_nota.find_all('script', type='application/ld+json'):
                  try:
                      datos = json.loads(script.string or script.get_text())
                  except (ValueError, TypeError):
                      continue
                  pendientes = datos if isinstance(datos, list) else [datos]
                  while pendientes:
                      dato = pendientes.pop()
                      if not isinstance(dato, dict):
                          continue
                      grafo = dato.get('@graph', [])
                      if isinstance(grafo, list):
                          pendientes.extend(grafo)
                      tipo = dato.get('@type', [])
                      tipos = [tipo] if isinstance(tipo, str) else tipo
                      if not isinstance(tipos, list) or not any(
                          t in ('Article', 'NewsArticle', 'BlogPosting') for t in tipos
                      ):
                          continue
                      autores = dato.get('author', [])
                      autores = autores if isinstance(autores, list) else [autores]
                      for autor in autores:
                          texto = autor.get('name', '') if isinstance(autor, dict) else autor
                          if isinstance(texto, str) and texto.strip().casefold() == nombre:
                              firma_estructurada = True

              if not (firma_visible or firma_meta or firma_estructurada):
                  print(f'Excluida por firma no confirmada: {url}')
                  return False, ''

              descripcion = ''
              for clave in ('og:description', 'description', 'twitter:description'):
                  etiqueta = pagina_nota.find('meta', attrs={'property': clave})
                  if not etiqueta:
                      etiqueta = pagina_nota.find('meta', attrs={'name': clave})
                  if etiqueta and etiqueta.get('content'):
                      descripcion = ' '.join(etiqueta['content'].split())
                      break
              return True, descripcion[:240]

          nuevas = 0
          for url, titulo in candidatos.items():
              if url in enlaces:
                  continue
              firma_valida, bajada = firma_y_bajada_verificadas(url)
              if not firma_valida:
                  continue
              f, foto = metadatos(url)
              tarjeta = documento.new_tag('article', attrs={
                  'class': 'story', 'data-outlet': 'ROLLING STONE',
                  'data-search': titulo.lower(), 'data-date': f
              })
              meta = documento.new_tag('div', attrs={'class': 'story-meta'})
              meta.string = 'ROLLING STONE · ' + (f if f else 'Fecha sin confirmar')
              tarjeta.append(meta)
              h3 = documento.new_tag('h3')
              h3.string = titulo
              tarjeta.append(h3)
              resumen = documento.new_tag('p')
              resumen.string = bajada or 'Una nota publicada en Rolling Stone Argentina.'
              tarjeta.append(resumen)
              enlace = documento.new_tag('a', href=url, target='_blank', rel='noopener noreferrer')
              enlace.string = 'Leer nota original ↗'
              tarjeta.append(enlace)
              if foto:
                  img = documento.new_tag('img', src=foto, alt='', loading='lazy')
                  img['class'] = 'story-cover'
                  tarjeta.insert(0, img)
              tarjetas.append(tarjeta)
              enlaces.add(url)
              nuevas += 1

          fotos = 0
          fechas = 0
          for tarjeta in tarjetas:
              enlace = tarjeta.find('a', href=True)
              if not enlace:
                  continue
              actual = tarjeta.get('data-date', '')
              if not actual:
                  meta = tarjeta.find(class_='story-meta')
                  actual = fecha(meta.get_text(' ', strip=True) if meta else '')
                  if actual:
                      tarjeta['data-date'] = actual
              if actual and tarjeta.find('img', class_='story-cover'):
                  continue
              f, foto = metadatos(enlace['href'])
              if not actual and f:
                  tarjeta['data-date'] = f
                  fechas += 1
                  meta = tarjeta.find(class_='story-meta')
                  if meta and ('incorporaci' in meta.get_text().lower() or 'sin confirmar' in meta.get_text().lower()):
                      meta.string = 'ROLLING STONE · ' + f
              if foto and not tarjeta.find('img', class_='story-cover'):
                  img = documento.new_tag('img', src=foto, alt='', loading='lazy', decoding='async')
                  img['class'] = 'story-cover'
                  tarjeta.insert(0, img)
                  fotos += 1

          tarjetas.sort(key=lambda t: t.get('data-date', ''), reverse=True)
          contenido = '\n'.join(str(t) for t in tarjetas) + '\n'
          nuevo = original[:bloque.start(2)] + contenido + original[bloque.end(2):]
          if '.story-cover{' not in nuevo:
              nuevo = nuevo.replace('</style>',
                  '.story-cover{display:block;width:calc(100% + 46px);height:180px;object-fit:cover;margin:-25px -23px 22px;border-bottom:1px solid #413939;background:#292126}\n</style>', 1)
          if nuevo != original:
              ARCHIVO.write_text(nuevo, encoding='utf-8')
          print(f'Resultado: {nuevas} notas nuevas, {fotos} fotos incorporadas, {fechas} fechas recuperadas; {len(tarjetas)} notas ordenadas.')
          PY

      - name: Publicar cambios en GitHub
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No hubo cambios.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Actualizar notas, imagenes y orden cronologico'
          git push
